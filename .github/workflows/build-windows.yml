name: build-windows

on:
  push:
  pull_request:

jobs:
  test-windows:
    # Plataforma de destino: estos tests bloquean la publicación del ejecutable.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Instalar dependencias
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Tests sin GUI
        run: uv run pytest --ignore=tests/gui --cov=envio_correos --cov-branch
      - name: Tests de GUI
        # En los runners de Windows, Tcl falla a veces de forma intermitente al leer su
        # init.tcl ("couldn't read file ... No error") al crear otra ventana en el mismo
        # proceso. Se reintenta SOLO ese error de arranque de Tk, no fallos de lógica.
        run: uv run pytest tests/gui --reruns 2 --only-rerun "Can't find a usable init.tcl"

  test-macos:
    # Entorno de desarrollo: se valida, pero no bloquea la publicación del ejecutable.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Instalar dependencias
        run: uv sync
      - name: Tests
        run: uv run pytest

  build:
    needs: test-windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # solo para publicar el Release al subir una etiqueta v*
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Instalar dependencias
        run: uv sync
      - name: Construir ejecutable (onefile)
        run: uv run pyinstaller packaging/envio_correos.spec --noconfirm --clean
      - name: Smoke test del ejecutable (quickstart P1)
        run: uv run python packaging/smoke_test.py dist/EnvioCorreos.exe
      - name: Publicar artefacto
        uses: actions/upload-artifact@v7
        with:
          name: EnvioCorreos-windows
          path: dist/EnvioCorreos.exe
      - name: Publicar Release (solo con etiqueta v*; con guion = pre-release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          sed "s#{{REPO}}#${GITHUB_REPOSITORY}#g" packaging/release-notes.md > notes.md
          gh release create "$TAG" dist/EnvioCorreos.exe \
            --title "Envío de correos $TAG" \
            --notes-file notes.md \
            "${flags[@]}"
