[project]
name = "envio-correos"
version = "0.1.0"
description = "Asistente de escritorio para envío masivo de correos desde Microsoft 365"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "customtkinter==6.0.0",
    "openpyxl==3.1.5",
    "dnspython==2.8.0",
    "keyring==25.7.0",
    "platformdirs>=4.12,<5",
    "defusedxml>=0.7",  # openpyxl lo usa si está instalado: protege de XML malicioso en .xlsx
]

[project.scripts]
envio-correos = "envio_correos.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "aiosmtpd==1.4.6",
    "trustme>=1.2",
    "psutil>=7",
    "ruff>=0.13",
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envio_correos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Session.login_data is deprecated:DeprecationWarning",
]
markers = [
    "slow: pruebas lentas (memoria, proceso real)",
]

[tool.coverage.run]
source = ["envio_correos"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20", "SIM"]
